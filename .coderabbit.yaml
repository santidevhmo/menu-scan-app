# CodeRabbit configuration.
#
# `scripts/fixtures/caches/` holds archived MODEL RESPONSES, not source. They are
# committed on purpose: `scripts/rescore-history.ts` replays them so an oracle
# correction can be applied to every historical run for $0, and three tests
# (`bench-macros_test.ts` x2, `macro-measure_test.ts`) fail without them. There is
# nothing to review in a raw JSON API capture.
#
# ⚠️ THIS DOES NOT RAISE THE 100-FILE REVIEW LIMIT. CodeRabbit counts the RAW diff
# BEFORE applying path_filters - PR #14 has 180 changed files and was skipped with
# "180 files exceed the limit of 100" even with this config in place. The filters
# only keep future, smaller PRs focused. A branch whose diff genuinely exceeds 100
# files needs a source-only review branch (see PR #15), NOT deletion of these
# archives.
#
# Excluding them from REVIEW is not the same as deleting them. They stay in the
# repo, tracked and intact.
reviews:
  path_filters:
    # Archived model responses: benchmark draws, generalisation probes, and the
    # extraction eval corpus. Evidence, not code.
    - "!scripts/fixtures/caches/**"
    # Frozen expectation files for the extraction harness - data, not logic.
    - "!scripts/fixtures/*.expected.json"
    - "!scripts/fixtures/photos/**"
    # Lockfiles.
    - "!**/package-lock.json"
    - "!**/deno.lock"
